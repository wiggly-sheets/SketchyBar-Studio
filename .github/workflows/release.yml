name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build DMG and publish release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vX.Y.Z" >&2
            exit 2
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg_name=SketchyBarStudio-$VERSION-universal.dmg" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test
        run: make test

      - name: Setup Node for create-dmg
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"

      - name: Build release artifacts
        env:
          SKETCHYBAR_STUDIO_BUILD: ${{ github.run_number }}
        run: make release-artifacts VERSION=${{ steps.version.outputs.version }}

      - name: Verify universal binary and bundle version
        run: |
          file dist/SketchyBarStudio.app/Contents/MacOS/SketchyBarStudio
          lipo dist/SketchyBarStudio.app/Contents/MacOS/SketchyBarStudio -verify_arch arm64 x86_64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/SketchyBarStudio.app/Contents/Info.plist)" = "${{ steps.version.outputs.version }}"
          codesign --verify --deep --strict dist/SketchyBarStudio.app

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release-notes.sh "$VERSION" > release-notes.md

      - name: Append the checksum to the release notes
        env:
          DMG_NAME: ${{ steps.version.outputs.dmg_name }}
        run: |
          {
            echo ""
            echo "DMG SHA-256:"
            echo ""
            echo '```'
            cat "dist/$DMG_NAME.sha256"
            echo '```'
          } >> release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG_NAME: ${{ steps.version.outputs.dmg_name }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/$DMG_NAME" "dist/$DMG_NAME.sha256" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "SketchyBar Studio $VERSION" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "dist/$DMG_NAME" "dist/$DMG_NAME.sha256" --title "SketchyBar Studio $VERSION" --notes-file release-notes.md
          fi
