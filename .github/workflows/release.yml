name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build DMG and publish release
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: The tag must sit on the default branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::The tag ${GITHUB_REF_NAME} is not on origin/master; cut it from the default branch"
            exit 1
          fi

      - name: Set release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vX.Y.Z" >&2
            exit 2
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg_name=SketchyBarStudio-$VERSION-universal.dmg" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Require the macOS 26 SDK
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-version)"
          MAJOR="${SDK%%.*}"
          if (( MAJOR < 26 )); then
            echo "This build needs the macOS 26 SDK or later; found $SDK." >&2
            exit 1
          fi

      - name: Test
        run: make test

      - name: Setup Node for create-dmg
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"

      - name: Build release artifacts
        env:
          SKETCHYBAR_STUDIO_BUILD: ${{ github.run_number }}
        run: make release-artifacts VERSION=${{ steps.version.outputs.version }}

      - name: Verify the bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make verify VERSION="$VERSION"

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DMG_NAME: ${{ steps.version.outputs.dmg_name }}
        run: |
          set -euo pipefail
          ./scripts/changelog.sh notes "$VERSION" > release-notes.md
          {
            echo ""
            echo "## Checksums"
            echo ""
            echo '```'
            cat "dist/$DMG_NAME.sha256"
            echo '```'
          } >> release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG_NAME: ${{ steps.version.outputs.dmg_name }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/$DMG_NAME" "dist/$DMG_NAME.sha256" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "SketchyBar Studio $VERSION" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "dist/$DMG_NAME" "dist/$DMG_NAME.sha256" --title "SketchyBar Studio $VERSION" --notes-file release-notes.md
          fi
