name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Require the macOS 26 SDK
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-version)"
          MAJOR="${SDK%%.*}"
          if (( MAJOR < 26 )); then
            echo "This build needs the macOS 26 SDK or later; found $SDK." >&2
            exit 1
          fi

      - name: Clean SwiftPM cache for workspace
        run: swift package clean

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package app bundle
        run: bash ./script/build_and_run.sh --package

      - name: Verify app bundle metadata
        run: |
          test -x dist/SketchyBarStudio.app/Contents/MacOS/SketchyBarStudio
          test -f dist/SketchyBarStudio.app/Contents/Resources/SketchyBarStudio.icns
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/SketchyBarStudio.app/Contents/Info.plist | grep SketchyBarStudio
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/SketchyBarStudio.app/Contents/Info.plist)" = "0.0.0"
          codesign --verify --deep --strict dist/SketchyBarStudio.app
