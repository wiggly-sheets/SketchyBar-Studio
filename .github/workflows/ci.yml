name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Require the macOS 26 SDK
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-version)"
          MAJOR="${SDK%%.*}"
          if (( MAJOR < 26 )); then
            echo "This build needs the macOS 26 SDK or later; found $SDK." >&2
            exit 1
          fi

      - name: Clean SwiftPM cache for workspace
        run: swift package clean

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Package app bundle
        run: make app

      # Checks the executable, the icon, the architecture, the version and the
      # signature in one place, so the same gate runs locally.
      - name: Verify app bundle metadata
        run: make verify
